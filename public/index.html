<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="description"
      content="A calm, simple place to plan your day and keep track of what matters."
    />
    <title>Daymark — To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Daymark home">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <span>daymark</span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> Your day, in focus</span>
      </header>

      <section class="welcome" aria-labelledby="page-title">
        <p class="eyebrow" id="today-label"></p>
        <h1 id="page-title">Make room for<br /><span>what matters.</span></h1>
        <p class="welcome-copy">A little progress each day adds up to big results.</p>
      </section>

      <section class="task-card" aria-label="Your tasks">
        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <span class="input-sparkle" aria-hidden="true">✳</span>
          <input
            id="task-input"
            name="title"
            type="text"
            maxlength="500"
            placeholder="What needs to get done?"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </form>

        <div class="task-toolbar">
          <div class="task-heading">
            <h2>Your tasks</h2>
            <span class="task-count" id="task-count" aria-live="polite">0</span>
          </div>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
        </div>

        <p class="notice" id="notice" role="status" hidden></p>
        <ul class="task-list" id="task-list" aria-live="polite" aria-busy="true"></ul>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">✳</span>
          <p class="empty-title">Nothing on the list just yet</p>
          <p class="empty-copy">Add a task above and make today count.</p>
        </div>

        <footer class="list-footer">
          <span id="remaining-count">0 tasks left</span>
          <button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button>
        </footer>
      </section>
      <p class="page-footnote">One thing at a time. You’ve got this.</p>
    </main>
  </body>
</html>
